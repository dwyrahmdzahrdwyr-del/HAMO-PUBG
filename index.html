.wheel{width:200px;height:200px;border-radius:50%;margin:12px auto;border:6px solid #f5c518;transition:transform 3s ease-out;background:conic-gradient(#f5c518 0 45deg,#222 45deg 90deg,#e91e63 90deg 135deg,#222 135deg 180deg,#00b894 180deg 225deg,#222 225deg 270deg,#6c5ce7 270deg 315deg,#222 315deg 360deg);display:flex;align-items:center;justify-content:center;font-weight:bold}
input{width:100%;padding:12px;margin:8px 0;border-radius:9px;border:none;background:#fff;color:#000;font-size:16px;text-align:center}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:16px;z-index:99}
.modal>div{background:#1c1c1c;padding:20px;border-radius:14px;width:100%;max-width:380px;text-align:center}
.paynum{background:#000;padding:12px;border-radius:9px;font-size:20px;font-weight:bold;color:#f5c518;margin:10px 0}
.payOpt{background:#2a2a2a;border:2px solid #333;padding:10px;border-radius:10px;flex:1;min-width:100px;cursor:pointer;text-align:center;font-weight:bold}
.payOpt.active{border-color:#f5c518;background:#3a2f00}
.transCard{background:#1c1c1c;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;text-align:right}
</style>
