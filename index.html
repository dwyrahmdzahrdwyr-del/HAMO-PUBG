<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMO PUBG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#fff;font-family:Arial;padding:15px}
h1{text-align:center;color:#f5c518;margin:15px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1c1c1c;border-radius:12px;padding:12px;text-align:center;border:1px solid #333}
.card img{width:100%;border-radius:10px}
.card h3{margin:10px 0 5px;font-size:16px}
.card p{color:#f5c518;font-weight:bold}
.card button{background:#f5c518;border:none;padding:8px 15px;border-radius:8px;font-weight:bold;margin-top:8px;width:100%}
</style>
</head>
<body>
<h1>HAMO PUBG - شحن شدات</h1>
<div class="grid" id="grid"></div>
<script>
  const items=[
{name:"60 شدة",price:"50 ج",img:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400"},
{name:"325 شدة",price:"250 ج",img:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400"},
{name:"660 شدة",price:"490 ج",img:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400"},
{name:"1800 شدة",price:"1300 ج",img:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400"}
];
let grid=document.getElementById("grid");
items.forEach(i=>{
grid.innerHTML+=`<div class="card"><img src="${i.img}"><h3>${i.name}</h3><p>${i.price}</p><button onclick="alert('اطلب: ${i.name}')">اطلب واتساب</button></div>`;
});
</script>
</body>
</html>
