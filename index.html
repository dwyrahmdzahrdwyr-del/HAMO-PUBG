<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAMO PUBG - شحن شدات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:12px;padding-bottom:30px}
.top{text-align:center;padding:10px}
.top a{color:#f5c518;font-weight:bold;text-decoration:none}
h1{text-align:center;color:#f5c518;font-size:26px}
.sub{text-align:center;color:#ccc;font-size:14px;margin:6px 0 14px}
.box{background:#1c1c1c;border:1px solid #f5c518;border-radius:14px;padding:14px;margin-bottom:14px}
.box label{display:block;color:#f5c518;font-weight:700;margin-bottom:7px}
.box input{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;font-size:18px;text-align:center;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:14px;text-align:center;border:1px solid #333;overflow:hidden;background:#1c1c1c}
.card .img{height:85px;display:flex;align-items:center;justify-content:center;font-size:42px}
.card .info{padding:11px}
.card h3{font-size:15px}
.card .price{color:#f5c518;font-weight:800;font-size:17px;margin-top:4px}
.card button{width:100%;padding:12px;border:0;border-radius:9px;background:#25D366;color:#fff;font-weight:800;margin-top:8px;cursor:pointer;font-size:15px}
.pay{text-align:center;background:#f5c518;color:#000;border-radius:12px;padding:13px;margin-top:14px;font-weight:800;font-size:16px}
.note{text-align:center;color:#aaa;font-size:13px;margin-top:10px;line-height:1.7}
</style>
</head>
<body>

<div class="top"><a href="index.html">⬅ رجوع لـ Tools</a></div>
<h1>🎮 HAMO PUBG</h1>
<p class="sub">اكتب ID ببجي بتاعك، وبعدين دوس على الباقة اللي عايزها</p>

<div class="box">
<label>🎯 اكتب ID ببجي بتاعك هنا الأول:</label>
<input id="pubgId" type="tel" placeholder="مثال: 5123456789" inputmode="numeric">
</div>

<div class="grid" id="pkgs"></div>

<div class="pay">💳 الدفع فودافون كاش: 01208398454</div>
<p class="note">ابعت الفلوس على فودافون كاش وبعدين دوس على الباقة<br>الطلب هيجيلي على الواتساب بالـ ID بتاعك ✅</p>

<script>
// أسعار HAMO = سعر Carry1st + 10 جنيه
let pkgs=[
["60 UC",60,"🔥","#ff6b00,#ffcc00"],
["325 UC",260,"💎","#00c6ff,#0072ff"],
["660 UC",511,"👑","#f7971e,#ffd200"],
["1800 UC",1372,"🚀","#8e2de2,#4a00e0"],
["3850 UC",2544,"⭐","#f857a6,#ff5858"],
["8100 UC",5077,"🏆","#11998e,#38ef7d"],
["16200 UC",10146,"💰","#f83600,#f9d423"],
["24300 UC",15215,"💎","#2193b0,#6dd5ed"],
["32400 UC",20283,"👑","#834d9b,#d04ed6"],
["40500 UC",25352,"🔥","#fc4a1a,#f7b733"]
];

document.getElementById("pkgs").innerHTML = pkgs.map(p=>`
<div class="card">
<div class="img" style="background:linear-gradient(135deg,${p[3]})">${p[2]}</div>
<div class="info">
<h3>${p[0]}</h3>
<p class="price">${p[1]} ج</p>
<button onclick="sendOrder('${p[0]}',${p[1]})">اطلب دي 📲</button>
</div>
</div>
`).join("");

function sendOrder(name, price){
  let id = document.getElementById("pubgId").value.trim();
  if(!id || id.length < 5){
    alert("اكتب ID ببجي بتاعك فوق الأول ❌");
    document.getElementById("pubgId").focus();
    return;
  }
  let msg = `طلب جديد من HAMO PUBG 🎮%0A%0A` +
  `الباقة: ${name}%0A` +
  `السعر: ${price} جنيه%0A` +
  `ID ببجي: ${id}%0A` +
  `الدفع: فودافون كاش 01208398454%0A%0A` +
  `انا اخترت الباقة دي وبعت الفلوس، اشحنلي لو سمحت`;
  window.open("https://wa.me/201208398454?text=" + msg, "_blank");
}
</script>
</body>
</html>
